<style>
:root{--red:#BC002D;--blue:#1F3A93;--ink:#222;--grey:#777;--bg:#fafafa}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink)}
#app{display:flex;height:100%}
#side{width:400px;max-width:100%;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid #ddd;z-index:500}
#map{flex:1}
header{background:var(--red);color:#fff;padding:11px 14px 9px;position:relative}
header h1{margin:0;font-size:19px}header .sub{font-size:12px;opacity:.9;margin-top:2px}
.ver{position:absolute;right:12px;top:11px;background:#fff;color:var(--red);font-weight:800;font-size:12px;padding:2px 8px;border-radius:10px}
.prog{margin-top:7px;font-size:13px;font-weight:600}
.bar{height:7px;background:rgba(255,255,255,.35);border-radius:4px;margin-top:4px;overflow:hidden}.bar>div{height:100%;background:#fff;width:0;transition:width .3s}
#tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid #ddd;scrollbar-width:none}
#tabs button{flex:none;border:0;background:none;padding:9px 11px;font-size:13px;cursor:pointer;color:#555;border-bottom:3px solid transparent}
#tabs button.on{color:var(--red);border-bottom-color:var(--red);font-weight:700}
.panel{display:none;flex:1;overflow-y:auto;flex-direction:column}.panel.on{display:flex}
#filters{padding:8px 10px;border-bottom:1px solid #ddd;background:#fff}
#filters select,#filters input[type=search]{width:100%;padding:7px;border:1px solid #ccc;border-radius:6px;font-size:14px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid #ccc;border-radius:14px;padding:3px 9px 3px 6px;font-size:12px;cursor:pointer;user-select:none;background:#fff;display:flex;align-items:center;gap:5px}
.chip .dot{width:11px;height:11px;border-radius:50%}.chip.off{opacity:.35}
.row2{display:flex;gap:10px;align-items:center;font-size:12.5px;margin-top:7px;flex-wrap:wrap}
.row2 button,.btn{font-size:12px;padding:3px 8px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
#list{padding-bottom:30px}
.city{position:sticky;top:0;background:#eee;padding:7px 12px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;z-index:2;cursor:pointer}
.city span{font-weight:500;color:#555;font-size:12.5px}
.subh{padding:6px 12px 2px;font-size:11.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.03em}
.item{display:flex;gap:9px;padding:7px 12px;border-bottom:1px solid #eee;align-items:flex-start}
.item input,.subit input,.pend input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:#0B7A3E}
.num{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.txt{flex:1;min-width:0}.txt .t{cursor:pointer}.txt b{font-size:13.5px}.note{font-size:12px;color:#555;margin-top:1px}
.cat{font-size:11px;margin-top:2px}
.done>.txt>.t b,.subit.done b{text-decoration:line-through;color:#888}
.subit{display:flex;gap:7px;align-items:flex-start;margin-top:6px;font-size:12.5px}.subit .sid{font-size:11px;font-weight:700;color:#777;width:24px;flex:none;margin-top:3px}
.flag{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;color:#fff;margin-left:4px;vertical-align:1px}
.ap{font-size:10.5px;color:#888;margin-left:3px}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;font:700 11px/22px system-ui,sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);position:relative}
.pin.done{opacity:.45}.pin.done::after{content:"✓";position:absolute;right:-6px;top:-7px;background:#0B7A3E;color:#fff;border-radius:50%;width:14px;height:14px;font-size:10px;line-height:14px;border:1px solid #fff}
.sp{min-width:22px;height:15px;padding:0 3px;border-radius:4px;color:#fff;font:700 9px/12px system-ui,sans-serif;text-align:center;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap}.sp.done{opacity:.45}.t2{cursor:pointer}
.pin.part::after{content:"";position:absolute;right:-4px;top:-4px;background:#F39C12;border-radius:50%;width:9px;height:9px;border:1px solid #fff}
.spin{width:22px;height:22px;color:#fff;font:700 9px/19px system-ui,sans-serif;text-align:center;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.spin.hosp{background:#D62728;border-radius:3px}.spin.pol{background:#1F3A93;border-radius:50%}.spin.evac{background:#1E8449;border-radius:50% 50% 3px 3px}.spin.gov{background:#0B1F4D;border:2px solid #F1C40F;border-radius:50%}
.pop b{font-size:14px}.pop .note{font-size:12.5px;margin:4px 0}.pop label{font-size:13px;display:flex;gap:6px;align-items:center;margin-top:5px}
.sec{padding:10px 14px}.sec h3{margin:12px 0 6px;font-size:15px}.sec p,.sec li{font-size:13px;line-height:1.4}
.em{display:flex;gap:10px;align-items:center;margin:6px 0}.em .n{background:var(--red);color:#fff;font-weight:800;border-radius:6px;padding:5px 8px;min-width:92px;text-align:center;font-size:15px}
.em .n.b{background:var(--blue);font-size:12.5px}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;padding:7px 0;border-bottom:1px solid #eee;font-size:13px}
.ph .ja{grid-column:1/3;font-size:16px}.ph .ro{font-weight:700}
.rule{padding:7px 0;border-bottom:1px solid #eee;font-size:13px}
.src{font-size:11px;color:#777}
.lg{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.lg i{display:inline-block;width:28px;height:5px;border-radius:3px;flex:none}
.saf{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:12.5px;cursor:pointer}
.pend{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #eee;font-size:13.5px}

.gs{position:relative;padding:7px 10px;background:#fff;border-bottom:1px solid #ddd;z-index:900}
.gs .box{display:flex;align-items:center;border:1.5px solid #bbb;border-radius:9px;background:#fff;padding:0 4px 0 9px}
.gs .box:focus-within{border-color:var(--gsc,#BC002D)}
.gs input{flex:1;min-width:0;border:0;outline:0;font-size:16px;padding:8px 4px;background:transparent}
.gs .x{border:0;background:#eee;border-radius:50%;width:26px;height:26px;font-size:15px;line-height:26px;cursor:pointer;color:#555;display:none;flex:none}
.gs.has .x{display:block}
.gs .res{position:absolute;left:10px;right:10px;top:100%;margin-top:-2px;background:#fff;border:1px solid #ccc;border-radius:0 0 9px 9px;box-shadow:0 6px 16px rgba(0,0,0,.18);max-height:min(60vh,420px);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.gs.open .res{display:block}
.gs .r{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid #f0f0f0;cursor:pointer;font-size:13px;line-height:1.3}
.gs .r:hover,.gs .r.sel{background:#fdf0f2}
.gs .r .bd{flex:none;font-size:10px;font-weight:700;color:#fff;border-radius:4px;padding:2px 5px;margin-top:1px;min-width:26px;text-align:center}
.gs .r .tx{flex:1;min-width:0}.gs .r small{display:block;color:#777;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs .r mark{background:#ffe08a;color:inherit;padding:0}
.gs .none{padding:10px;color:#777;font-size:13px}
.hl{animation:hlf 2.4s ease}@keyframes hlf{0%,60%{background:#ffe9a8}100%{background:transparent}}
#toggle{display:none}
@media (max-width:800px){
 #app{flex-direction:column}
 #side{position:fixed;left:0;right:0;bottom:0;width:100%;height:62%;border-right:0;border-top:1px solid #ccc;border-radius:14px 14px 0 0;overflow:hidden;transition:transform .25s;box-shadow:0 -3px 12px rgba(0,0,0,.2)}
 #side.min{transform:translateY(calc(100% - 162px))}
 #map{height:100%}
 #toggle{display:block;position:absolute;right:62px;top:9px;background:rgba(255,255,255,.25);border:0;color:#fff;font-size:13px;padding:4px 9px;border-radius:6px}
 header{cursor:pointer}
}
</style></head><body>

r","Biiru o hitotsu kudasai","ビールを一つください"],["Soy alérgico/a a …","… arerugī ga arimasu","…アレルギーがあります"],["¿Puedo tomar una foto?","Shashin o totte mo ii desu ka?","写真を撮ってもいいですか？"],["¡Ayuda!","Tasukete!","助けて！"],["Llame a una ambulancia, por favor","Kyūkyūsha o yonde kudasai","救急車を呼んでください"],["Hasta luego / adiós","Sayōnara / Ja mata","さようなら / じゃあまた"]],"etiqueta":[["Propinas","No se deja propina; hasta puede ser incómodo. El buen servicio ya viene incluido."],["Efectivo","Aunque cada vez aceptan más tarjetas, muchos sitios chiquitos (templos, puestos, izakayas) son solo efectivo. Lleven yenes."],["Trenes en silencio","Nada de hablar por teléfono en el tren y bajen la voz; celular en 'modo manners' (silencio)."],["Comer caminando","Está mal visto comer o beber mientras se camina por la calle; cómanse las cosas al lado del puesto o de la máquina."],["Zapatos","Quítense los zapatos en casas, ryokan, algunos templos y restaurantes con tatami. Hay chancletas especiales pa'l baño."],["Onsen y tatuajes","En los onsen (aguas termales) uno se baña desnudo y se lava ANTES de entrar. Muchos prohíben tatuajes: busquen onsen 'tattoo-friendly' o cúbranlos."],["Basura","Casi no hay zafacones en la calle: carguen una bolsita y boten la basura en el hotel o en las konbini. Hay que separar por tipo."],["Fumar","Prohibido fumar en la calle en muchas ciudades (Tokio, Kioto, Osaka...). Solo en las zonas de fumar marcadas."],["Pasaporte","Por ley, los turistas tienen que cargar el pasaporte original siempre. La policía puede pedirlo."],["Alcohol y guiar","Tolerancia cero: manejar con alcohol es delito grave, y los pasajeros que van con el chofer también pueden ser castigados. Esto aplica a los go-karts."],["Escaleras eléctricas","Uno se para a un lado y se deja el otro libre: en Tokio a la IZQUIERDA, en Osaka a la DERECHA."],["Filas","Se hace fila ordenada pa' todo, incluso en el andén del tren (hay marcas en el piso)."],["Fotos","No tomen fotos de geishas/maiko sin permiso (en Gion hay multas en callejones privados) ni dentro de muchos templos. Pregunten."],["Templos y santuarios","Hablen bajito, no se metan en áreas cerradas y sigan el ritual de purificación con el agua si quieren."],["Palillos","No claven los palillos parados en el arroz ni pasen comida de palillo a palillo (es cosa de funerales)."],["Sonarse la nariz","Sonarse la nariz en público está mal visto; mejor apártense."],["Taxis","Las puertas se abren y cierran solas: no las toquen."],["Drogas","Las leyes de drogas son estrictísimas: el cannabis es ilegal (aunque sea legal en EE. UU.) y hasta cantidades mínimas dan cárcel y deportación."],["Bicicletas y cruces","Esperen la luz verde aunque no venga nadie; cruzar en rojo está mal visto."],["Tarjeta IC","Usen Suica/PASMO/ICOCA (o la versión en el celular) pa' trenes, konbini y máquinas: más rápido que comprar boletos."]],"prohibido":[["Adderall y anfetaminas","PROHIBIDO aunque tengas receta: la anfetamina/metanfetamina es 'estimulante' en Japón y no se puede entrar ni pa' tratamiento.","MHLW – Narcotics Control Dept."],["Vyvanse (lisdexanfetamina)","Solo con PERMISO previo del Narcotics Control Dept. (solicitar al menos 14 días antes) y cargándolo uno mismo.","MHLW – Narcotics Control Dept."],["Sudafed, Actifed y similares (pseudoefedrina)","Productos con más de 10% de pseudoefedrina/efedrina son 'materia prima de estimulantes': prohibidos sin permiso previo. Mejor no traerlos y comprar alternativas allá.","MHLW – Lista de sustancias controladas"],["Codeína y otros opioides (oxicodona, morfina, fentanilo)","La codeína es 'narcótico' (excepto productos con 1% o menos). Requiere permiso previo del Narcotics Control Dept.","MHLW – Narcotics Control Dept."],["Medicinas en general","Sin trámite: hasta 1 mes de medicinas recetadas y hasta 2 meses de medicinas sin receta. Más que eso: pedir el 'Yunyu Kakunin-sho' (certificado de importación) ANTES de salir.","MHLW – Medicinas de uso personal"],["Psicotrópicos (ej. Xanax, Valium, Ambien)","Permitidos dentro de las cantidades de la tabla oficial; si es más, carta del médico. Llevar en su envase con la receta.","MHLW – Narcotics Control Dept."],["CBD, THC y cannabis","THC y cannabis: PROHIBIDOS (aunque sean legales en EE. UU.). CBD: solo productos sin THC; desde junio 2026 el CBN también está prohibido. Recomendación: no traer nada de esto.","MHLW – NCD (CBD)"],["Armas de fuego y municiones","Prohibidas para turistas; también réplicas que parezcan reales pueden traer problemas.","Japan Customs"],["Cuchillos y navajas","Prohibido CARGAR en la calle hojas de más de 6 cm sin razón justificada (defensa propia no cuenta). Ojo con navajas tipo multiusos.","Policía Metropolitana de Tokio"],["Espadas reales (katana / nihontō)","Se pueden comprar si tienen su certificado de registro (登録証, tōken tōroku-shō), que tiene que ir SIEMPRE con la espada. Pa' sacarla de Japón hace falta el certificado de exportación de la Agencia de Asuntos Culturales (古美術品輸出鑑査証明; toma como 10 días hábiles o más, así que la tienda lo tramita con tiempo o la envía) y después se devuelve el registro a la prefectura. Las que son Tesoro Nacional o Bien Cultural Importante NO se pueden exportar. En el avión: solo en maleta facturada, nunca en cabina. Al llegar a EE. UU./PR: declararla en Aduanas (CBP) y chequear la ley de PR.","Agencia de Asuntos Culturales · Junta de Educación de Tokio · TSA · CBP"],["Réplicas y espadas de práctica (iaitō / mogitō)","No llevan registro ni permiso de exportación, pero igual: maleta facturada y nunca cargarlas a la vista por la calle (aplican las reglas de cuchillos).","TSA · Policía Metropolitana de Tokio"],["Drones","Drones de 100 g o más (con batería) hay que registrarlos en Japón y llevar ID remoto; hay zonas donde no se puede volar sin permiso (ciudades densas, cerca de aeropuertos).","MLIT – Civil Aviation Bureau"],["Carnes y embutidos (jerky, salchichas, jamón)","Productos de carne de EE. UU. no se pueden traer sin certificado sanitario oficial: no traigan jerky ni carnes.","MAFF – Animal Quarantine Service"],["Frutas, plantas y semillas","Requieren inspección de cuarentena; muchas frutas frescas están prohibidas. Declárenlas o no las traigan.","MAFF – Plant Protection Station"],["Monedas de yen (anillos de monedas)","Hacerle hoyos, doblar o derretir yenes de los que circulan hoy es ilegal en Japón (Ley de daño a la moneda). Los talleres de coin rings usan monedas antiguas o extranjeras.","Ministerio de Finanzas (MOF)"]],"fuentes":[["MHLW – Narcotics Control Dept. (guía para viajeros)","https://www.ncd.mhlw.go.jp/en/application2.html"],["MHLW – Lista de sustancias controladas (PDF)","https://www.ncd.mhlw.go.jp/dl_data/keitai/cotrolled_substances_list20241212%20.pdf"],["MHLW – Medicinas de uso personal / Yunyu Kakunin-sho","https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iyakuhin/kojinyunyu/topics/tp010401-1_00001.html"],["MHLW – NCD: productos con CBD","https://www.ncd.mhlw.go.jp/cbd.html"],["Japan Customs – Medicinas para viajeros","https://www.customs.go.jp/english/c-answer_e/sonota/9005_e.htm"],["Japan Customs – Artículos prohibidos","https://www.customs.go.jp/english/summary/prohibit.htm"],["Policía Metropolitana de Tokio – Cuchillos","https://www.keishicho.metro.tokyo.lg.jp/kurashi/drug/hamono/hamono.html"],["MLIT – Reglas de drones","https://www.mlit.go.jp/en/koku/uas.html"],["MAFF – Animal Quarantine Service","https://www.maff.go.jp/aqs/english/"],["MAFF – Plant Protection Station","https://www.maff.go.jp/pps/j/introduction/english.html"],["Agencia de Asuntos Culturales – Certificado de exportación de antigüedades (incluye espadas)","https://www.bunka.go.jp/seisaku/bunkazai/kokusai/kobijutsuhin/index.html"],["Junta de Educación de Tokio – Exportar espadas registradas","https://www.kyoiku.metro.tokyo.lg.jp/lifelong/cultural_property/registration/registration_03_02"],["TSA – Armas de artes marciales (espadas: solo maleta facturada)","https://www.tsa.gov/travel/security-screening/whatcanibring/items/mar function render(fit){

 const vis=D.items.filter(visible);const L2=[];
 D.items.forEach(i=>{const m=markers[i.n];if(!m)return;m.setIcon(icon(i));
  if(vis.includes(i)){if(!gPlaces.hasLayer(m))gPlaces.addLayer(m);L2.push([i.lat,i.lon])}else if(gPlaces.hasLayer(m))gPlaces.removeLayer(m)});
 Object.values(smarkers).forEach(m=>{const i=m._it;m.setIcon(sicon(i,m._s));if(vis.includes(i)){if(!gPlaces.hasLayer(m))gPlaces.addLayer(m)}else if(gPlaces.hasLayer(m))gPlaces.removeLayer(m)});

 document.getElementById("barf").style.width=(nd*100/tot)+"%";
 let h="";
 D.cities.forEach(c=>{const all=D.items.filter(i=>i.city===c).flatMap(ids),v=vis.filter(i=>i.city===c);if(!v.length)return;
  h+=`<div class="city" data-c="${c}">${c}<span>${all.filter(x=>done[x]).length}/${all.length} ✓</span></div>`;
  let sub="";v.forEach(i=>{if(i.sub!==sub){sub=i.sub;h+=`<div class="subh">${esc(sub)}</div>`}

const NRM=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\bkyoto\b/g,"kioto").replace(/\btokyo\b/g,"tokio").replace(/pokemon/g,"pokemon").replace(/\s+/g," ");
const ALIAS=q=>NRM(q).replace(/kyoto/g,"kioto").replace(/tokyo/g,"tokio").replace(/^#/,"").trim();
function gsSetup(IDX,go){
 const W=document.getElementById("gs"),inp=W.querySelector("input"),res=W.querySelector(".res"),x=W.querySelector(".x");
 IDX.forEach(e=>e._t=NRM(e.t+" "+e.title+" "+(e.sub||"")));
 let cur=[],sel=0;
 const hi=(txt,q)=>{const n=NRM(txt);const words=q.split(" ").filter(Boolean);let out="",i=0;const raw=String(txt);
  // marcar la primera palabra que aparezca (posiciones iguales tras normalizar caracter a caracter)
  const w=words.find(w=>n.indexOf(w)>=0);if(!w||n.length!==raw.length)return esc(raw);const p=n.indexOf(w);
  return esc(raw.slice(0,p))+"<mark>"+esc(raw.slice(p,p+w.length))+"</mark>"+esc(raw.slice(p+w.length))};
 function search(){const q=ALIAS(inp.value);W.classList.toggle("has",!!inp.value);
  if(!q){W.classList.remove("open");cur=[];return}
  const words=q.split(" ").filter(Boolean);
  cur=IDX.map(e=>{let sc=0;for(const w of words){const k=e._t.indexOf(w);if(k<0)return null;
    const tn=NRM(e.title);sc+=(tn===w?100:tn.startsWith(w)?60:tn.indexOf(w)>=0?40:(NRM(e.id)===w?90:10))}
   return [sc+(e.pri||0),e]}).filter(Boolean).sort((a,b)=>b[0]-a[0]).slice(0,40).map(a=>a[1]);
  sel=0;res.innerHTML=cur.length?cur.map((e,k)=>`<div class="r ${k===0?"sel":""}" data-k="${k}"><span class="bd" style="background:${e.col||"#555"};color:${e.tc||"#fff"}">${esc(e.badge)}</span><div class="tx"><b>${hi(e.title,words[0])}</b><small>${esc(e.sub||"")}</small></div></div>`).join("")
   :`<div class="none">Nada pa' "${esc(inp.value)}". Prueba otra palabra.</div>`;
  W.classList.add("open")}
 function pick(k){const e=cur[k];if(!e)return;W.classList.remove("open");inp.blur();go(e)}
 inp.addEventListener("input",search);inp.addEventListener("focus",()=>{if(typeof gsFocus==="function")gsFocus();if(inp.value)search()});
 inp.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();pick(sel)}
  else if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){ev.preventDefault();if(!cur.length)return;sel=(sel+(ev.key==="ArrowDown"?1:cur.length-1))%cur.length;
   res.querySelectorAll(".r").forEach((r,k)=>r.classList.toggle("sel",k===sel));const r=res.querySelector(".r.sel");r&&r.scrollIntoView({block:"nearest"})}
  else if(ev.key==="Escape"){inp.value="";search();inp.blur()}});
 res.addEventListener("mousedown",ev=>ev.preventDefault());
 res.addEventListener("click",ev=>{const r=ev.target.closest(".r");if(r)pick(+r.dataset.k)});
 x.addEventListener("click",()=>{inp.value="";search();inp.focus()});
 document.addEventListener("click",ev=>{if(!W.contains(ev.target))W.classList.remove("open")});
 window.__gs={inp,search,pick,get cur(){return cur}};
}
function flashEl(el){if(!el)return;el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("hl");void el.offsetWidth;el.classList.add("hl")}

(function(){
 const TABN={"p-tren":"Trenes","p-saf":"Seguridad","p-proh":"No traer","p-fra":"Frases","p-eti":"Etiqueta","p-pend":"Pendientes"};

 Object.entries(D.safety).forEach(([k,S])=>["gov","hosp","pol","evac"].forEach(kind=>(S[kind]||[]).forEach((f,ix)=>IDX.push({pri:-25,k:"tab",p:"p-saf",sel:`#saf .saf[data-k="${k}"][data-kind="${kind}"][data-ix="${ix}"]`,click:1,id:"",badge:{hosp:"H",pol:"K",evac:"E",gov:"★"}[kind]+(ix+1),col:{hosp:"#D62728",pol:"#1F3A93",evac:"#1E8449",gov:"#0B1F4D"}[kind],
   title:f.en||f.ja||f.addr,sub:"Seguridad · "+S.title+" · "+SN2[kind],t:"seguridad emergencia "+SN2[kind]+" "+S.title+" "+(f.ja||"")+" "+(f.addr||"")+(f.er?" urgencias":"")+(f.tsunami?" tsunami":"")}))));
 D.emerg.forEach(([n,l])=>IDX.push({pri:45,k:"tab",p:"p-saf",sel:"#saf .em",id:n,badge:"☎",col:"#BC002D",title:n+" – "+l,sub:"Seguridad · Emergencias",t:"emergencia telefono numero policia ambulancia "+l}));
 D.prohibido.forEach(([t,r,src],k)=>IDX.push({pri:-25,k:"tab",p:"p-proh",sel:"#proh .rule",nth:k,id:"",badge:"🚫",col:"#7B241C",title:t,sub:"No traer · "+r,t:"no traer prohibido "+r+" "+src}));
 D.frases.forEach(([es,ro,ja],k)=>IDX.push({pri:-25,k:"tab",p:"p-fra",sel:"#fra .ph",nth:k,id:"",badge:"文",col:"#1F3A93",title:es+" – "+ro,sub:"Frases · "+ja,t:"frase frases "+ja}));
 D.etiqueta.forEach(([t,r],k)=>IDX.push({pri:-25,k:"tab",p:"p-eti",sel:"#eti .rule",nth:k,id:"",badge:"礼",col:"#117A65",title:t,sub:"Etiqueta · "+r,t:"etiqueta regla "+r}));
 D.pend.forEach((t,k)=>IDX.push({pri:-25,k:"tab",p:"p-pend",sel:"#pendl .pend",nth:k,id:"",badge:"☐",col:"#B7950B",title:t,sub:"Pendientes",t:"pendiente pendientes por hacer"}));
 const tabBtn=p=>document.querySelector(`#tabs button[data-p="${p}"]`);
 window.gsFocus=()=>{if(innerWidth<=800)side.classList.remove("min")};
 function showAll(){sel.value="";document.getElementById("q").value="";document.getElementById("pend").checked=false;Object.keys(catOn).forEach(x=>catOn[x]=true);render(false)}
 gsSetup(IDX,e=>{
  if(e.k==="tab"){tabBtn(e.p).click();setTimeout(()=>{const els=document.querySelectorAll(e.sel);const el=e.nth!=null?els[e.nth]:(e.click?els[0]:[...els].find(x=>x.textContent.includes(e.id))||els[0]);
    if(e.click&&el)el.click();if(innerWidth<=800&&e.click)setTimeout(()=>flashEl(el),50);else flashEl(el)},60);return}
  tabBtn("p-lug").click();showAll();
  const i=e.i;let el=document.querySelector(`#list .item[data-n="${i.n}"]`);
  if(e.k==="sub"){const se=document.querySelector(`#list .subit[data-sid="${e.s.id}"]`);if(se)el=se}
  let m=e.k==="sub"&&smarkers[e.s.id]?smarkers[e.s.id]:markers[i.n];
  if(m){if(!gPlaces.hasLayer(m))gPlaces.addLayer(m);map.flyTo(m.getLatLng(),16,{duration:.8});setTimeout(()=>m.openPopup(),850)}
  if(innerWidth<=800){if(m)mini();else side.classList.remove("min")}
  setTimeout(()=>flashEl(el),m?120:30)});
})();
